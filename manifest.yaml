# 1c-ninja-kit manifest
name: 1c-ninja-kit
version: 0.4.1
platform: windows
primaryAdapter: opencode
assumesMachineSoft: false
license: see NOTICE.md

layers:
  - machine
  - profile
  - project
  - adapter

profile:
  default: 1c-ninja-kit
  targetByAdapter:
    opencode: "%USERPROFILE%\\.config\\opencode (skills/ agents/ kit-rules/ AGENTS.md)"

components:
  1c-ninja-mcp:
    path: components/1c-ninja-mcp
    entry: main.os
    pair: project-scaffold/cfe/NinjaLive
  NinjaLive:
    path: project-scaffold/cfe/NinjaLive
    rootUrl: ninja-live

companions:
  pins: companions/pins.json

stackDefaults:
  file: install/path-defaults.windows.yaml
  apache:
    "8.3": { port: 8083, toolsDir: "%USERPROFILE%\\tools\\apache-83" }
    "8.5": { port: 8085, toolsDir: "%USERPROFILE%\\tools\\apache-85" }

cli:
  entry: install/kit.ps1
  commands: [doctor, verify, apply, init-project]
  adapters: [opencode]
  forbidInitOn: [ecoladev]

adapters:
  opencode: { status: implemented, path: adapters/opencode, bridge: mcp+skills+agents+AGENTS.md }

tests:
  opencode: docs/TEST-GUIDE-opencode.md
  machineBootstrap: docs/MACHINE-BOOTSTRAP.md
  bridge: adapters/BRIDGE-CONTRACT.md
